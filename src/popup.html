<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bilingo</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup-page">
    <main class="popup-card">
      <header class="brand">
        <span class="brand-mark" aria-hidden="true">B</span>
        <div><strong>Bilingo</strong><small>for Bilibili</small></div>
      </header>
      <label class="toggle-row">
        <span
          ><strong>学习字幕 / Learning captions</strong
          ><small
            >增强 Bilibili 视频字幕 / Enhance captions on Bilibili video
            pages</small
          ></span
        >
        <input id="enabled" type="checkbox" role="switch" />
      </label>
      <p id="status" class="notice" role="status">
        打开 Bilibili 视频开始使用 / Open a Bilibili video to begin.
      </p>
      <button id="options" class="secondary wide" type="button">
        字幕设置 / Caption settings
      </button>
      <p class="privacy-note">
        字幕仅在浏览器内处理 / Caption processing stays in your browser.<br /><a
          href="about.html"
          target="_blank"
          >隐私与权限说明 / Privacy & permissions</a
        >
      </p>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
